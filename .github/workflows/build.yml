name: Build jailed dylib
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jailed-build:
    runs-on: macos-15-intel
    env:
      THEOS: ${{ github.workspace }}/.theos-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Install Theos and tools
        run: bash scripts/setup-theos.sh
      - name: Build jailed dylib
        run: bash scripts/package.sh jailed
      - uses: actions/upload-artifact@v4
        with:
          name: GunshotJailed
          path: packages/jailed/GunshotJailed.dylib
          if-no-files-found: error
